<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bảng chấm công - Nguyễn Trần</title>
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chấm công">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f9; color: #1f2937; }
    .wrap { max-width: 460px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    header img { width: 64px; height: auto; flex-shrink: 0; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; margin: 0; color: #1e1b4b; }
    .cty { color: #4b5563; font-size: 13px; margin-top: 2px; line-height: 1.35; }
    .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin: 10px 0 6px; color: #374151; }
    input[type=text], input[type=password], input[type=month], textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    textarea { resize: vertical; min-height: 60px; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; }
    button { width: 100%; border: 0; border-radius: 12px; font-size: 18px; font-weight: 600; padding: 16px; cursor: pointer; }
    button:disabled { opacity: .5; }
    .btn-main { background: #2563eb; color: #fff; margin-top: 16px; }
    .row { display: flex; gap: 12px; }
    .btn-vao { background: #16a34a; color: #fff; font-size: 22px; padding: 26px 0; }
    .btn-ra { background: #ea580c; color: #fff; font-size: 22px; padding: 26px 0; }
    .clock { font-size: 40px; font-weight: 700; text-align: center; letter-spacing: 1px; }
    .date { text-align: center; color: #6b7280; margin-bottom: 4px; }
    .msg { padding: 12px; border-radius: 10px; font-size: 15px; margin-top: 12px; display: none; }
    .msg.ok { background: #dcfce7; color: #166534; display: block; }
    .msg.err { background: #fee2e2; color: #991b1b; display: block; }
    .msg.info { background: #e0e7ff; color: #3730a3; display: block; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
    li:last-child { border-bottom: 0; }
    .tag { font-weight: 700; }
    .tag.VÀO { color: #16a34a; } .tag.RA { color: #ea580c; }
    .note { color: #6b7280; font-size: 13px; }
    .link { background: none; color: #6b7280; font-size: 14px; font-weight: 400; padding: 8px; margin-top: 8px; }
    .hidden { display: none; }
    .ls-hang { display: flex; gap: 8px; align-items: flex-end; }
    .ls-hang input { flex: 1; }
    .ls-hang button { width: auto; padding: 12px 18px; font-size: 16px; background: #1e1b4b; color: #fff; }
    .ngay { border-top: 1px solid #eef0f3; padding: 12px 0 6px; }
    .ngay:first-child { border-top: 0; }
    .ngay-dau { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
    .canh-bao { font-size: 12px; font-weight: 600; color: #b45309; background: #fef3c7; border-radius: 6px; padding: 2px 8px; }
    .canh-bao.do { color: #991b1b; background: #fee2e2; }
    .ngay li { padding: 6px 0; border-bottom: 0; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="Logo Thiết bị Nguyễn Trần">
    <div>
      <h1>BẢNG CHẤM CÔNG</h1>
      <div class="cty">Công ty Cổ phần Thương mại và Tư vấn Giải pháp Thiết bị Nguyễn Trần</div>
    </div>
  </header>

  <!-- Đăng nhập -->
  <div id="manDangNhap" class="card">
    <label for="maNV">Mã nhân viên</label>
    <input id="maNV" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="VD: anhquan">
    <label for="pin">Mã PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
    <div class="check"><input id="nho" type="checkbox" checked><label for="nho" style="margin:0">Ghi nhớ trên điện thoại này</label></div>
    <button id="btnDangNhap" class="btn-main">Đăng nhập</button>
    <div id="msgDangNhap" class="msg"></div>
  </div>

  <!-- Chấm công -->
  <div id="manChamCong" class="hidden">
    <div class="card">
      <div class="date" id="ngay"></div>
      <div class="clock" id="dongHo">--:--:--</div>
      <div style="text-align:center;margin-top:6px">Xin chào <b id="ten"></b></div>
    </div>
    <div class="card">
      <div class="row">
        <button id="btnVao" class="btn-vao">VÀO</button>
        <button id="btnRa" class="btn-ra">RA</button>
      </div>
      <label for="ghiChu">Ghi chú (không bắt buộc; nếu đang ở chỗ khách thì phải ghi tên khách hàng)</label>
      <textarea id="ghiChu" placeholder="VD: đi sửa máy tại khách hàng ABC / về sớm vì đi giao hàng"></textarea>
      <div id="msg" class="msg"></div>
    </div>
    <div class="card">
      <b>Hôm nay</b>
      <ul id="dsHomNay"></ul>
    </div>
    <div class="card">
      <b>Lịch sử chấm công</b>
      <div class="ls-hang">
        <div style="flex:1"><label for="thang">Chọn tháng</label><input id="thang" type="month"></div>
        <button id="btnLichSu">Xem</button>
      </div>
      <div id="msgLichSu" class="msg"></div>
      <div id="dsLichSu" style="margin-top:8px"></div>
    </div>
    <button id="btnThoat" class="link">Đăng xuất</button>
  </div>
</div>

<script>
  // Địa chỉ web app Google Apps Script (Code.gs, hàm doPost)
  var API = 'https://script.google.com/macros/s/AKfycbwI8WRxjAk2DlkSIUjPUTbJTvsF0RMwSz5w4bI1Nod-SEWY-i3cFYPyH41YsA7Gc9L7/exec';

  var phien = null; // {maNV, pin}
  var $ = function (id) { return document.getElementById(id); };

  function luu(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function doc(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function baoLoi(el, text, kieu) { el.className = 'msg ' + kieu; el.textContent = text; }

  function goi(hanhDong, duLieu) {
    var yc = Object.assign({ hanhDong: hanhDong }, duLieu);
    return fetch(API, { method: 'POST', body: JSON.stringify(yc) })
      .then(function (r) { return r.json(); })
      .catch(function () { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); })
      .then(function (kq) { if (!kq.ok) throw new Error(kq.loi); return kq.data; });
  }

  function chayDongHo() {
    var d = new Date();
    $('dongHo').textContent = d.toLocaleTimeString('vi-VN', { hour12: false });
    $('ngay').textContent = d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function dongLuot(b) {
    var li = document.createElement('li');
    var trai = document.createElement('span');
    var tag = document.createElement('span');
    tag.className = 'tag ' + b.loai;
    tag.textContent = b.loai;
    trai.appendChild(tag);
    if (b.noi) { var p = document.createElement('div'); p.className = 'note'; p.textContent = b.noi; trai.appendChild(p); }
    if (b.ghiChu) { var n = document.createElement('div'); n.className = 'note'; n.textContent = b.ghiChu; trai.appendChild(n); }
    var phai = document.createElement('span');
    phai.textContent = b.gio;
    li.appendChild(trai); li.appendChild(phai);
    return li;
  }

  function hienHomNay(ds) {
    var ul = $('dsHomNay');
    ul.innerHTML = '';
    if (!ds.length) { ul.innerHTML = '<li class="note">Chưa chấm lượt nào hôm nay.</li>'; return; }
    ds.forEach(function (b) { ul.appendChild(dongLuot(b)); });
  }

  function hienLichSu(kq) {
    var box = $('dsLichSu');
    box.innerHTML = '';
    if (!kq.ngays.length) { box.innerHTML = '<div class="note">Tháng này chưa có ngày làm việc nào.</div>'; return; }
    kq.ngays.forEach(function (ng) {
      var div = document.createElement('div');
      div.className = 'ngay';
      var dau = document.createElement('div');
      dau.className = 'ngay-dau';
      var ten = document.createElement('span');
      ten.textContent = ng.thu + ', ' + ng.ngay;
      dau.appendChild(ten);
      var cb = document.createElement('span');
      ng.canhBao.forEach(function (c) {
        var s = document.createElement('span');
        s.className = 'canh-bao' + (/Chưa|Thiếu/.test(c) ? ' do' : '');
        s.textContent = c;
        s.style.marginLeft = '4px';
        cb.appendChild(s);
      });
      dau.appendChild(cb);
      div.appendChild(dau);
      var ul = document.createElement('ul');
      ng.luot.forEach(function (b) { ul.appendChild(dongLuot(b)); });
      div.appendChild(ul);
      box.appendChild(div);
    });
  }

  function xemLichSu() {
    var v = $('thang').value; // yyyy-mm
    if (!v) return;
    var p = v.split('-');
    $('btnLichSu').disabled = true;
    baoLoi($('msgLichSu'), 'Đang tải...', 'info');
    goi('lichSu', { maNV: phien.maNV, pin: phien.pin, thang: Number(p[1]), nam: Number(p[0]) })
      .then(function (kq) { $('msgLichSu').className = 'msg'; hienLichSu(kq); })
      .catch(function (e) { baoLoi($('msgLichSu'), e.message, 'err'); })
      .then(function () { $('btnLichSu').disabled = false; });
  }

  function vaoManChamCong(kq) {
    $('manDangNhap').classList.add('hidden');
    $('manChamCong').classList.remove('hidden');
    $('ten').textContent = kq.hoTen;
    hienHomNay(kq.homNay);
    chayDongHo();
    if (!window._dongHo) window._dongHo = setInterval(chayDongHo, 1000);
    var d = new Date();
    $('thang').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    $('dsLichSu').innerHTML = '';
  }

  function dangNhap(maNV, pin, tuDong) {
    $('btnDangNhap').disabled = true;
    baoLoi($('msgDangNhap'), 'Đang kiểm tra...', 'info');
    goi('dangNhap', { maNV: maNV, pin: pin })
      .then(function (kq) {
        phien = { maNV: maNV, pin: pin };
        if ($('nho').checked) { luu('cc_maNV', maNV); luu('cc_pin', pin); }
        $('msgDangNhap').className = 'msg';
        vaoManChamCong(kq);
      })
      .catch(function (e) {
        $('btnDangNhap').disabled = false;
        if (tuDong && /Sai mã|khóa/.test(e.message)) luu('cc_pin', null);
        baoLoi($('msgDangNhap'), e.message, 'err');
      });
  }

  function layViTri() {
    return new Promise(function (resolve) {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        function (p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude, saiSo: p.coords.accuracy }); },
        function () { resolve(null); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  function cham(loai) {
    var msg = $('msg');
    $('btnVao').disabled = $('btnRa').disabled = true;
    baoLoi(msg, 'Đang lấy vị trí...', 'info');
    layViTri().then(function (viTri) {
      var ghiChu = $('ghiChu').value.trim();
      if (!viTri && !ghiChu) {
        $('btnVao').disabled = $('btnRa').disabled = false;
        baoLoi(msg, 'Không lấy được vị trí. Hãy bật định vị (GPS) và cho phép trình duyệt dùng vị trí rồi bấm lại. Nếu vẫn không được, ghi lý do vào ô ghi chú rồi bấm lại.', 'err');
        return;
      }
      baoLoi(msg, 'Đang ghi nhận...', 'info');
      goi('chamCong', { maNV: phien.maNV, pin: phien.pin, loai: loai, viTri: viTri, ghiChu: ghiChu })
        .then(function (kq) {
          $('ghiChu').value = '';
          var cuoi = kq.homNay.length ? kq.homNay[kq.homNay.length - 1] : { gio: '', noi: '' };
          baoLoi(msg, 'Đã chấm ' + loai + ' lúc ' + cuoi.gio + (cuoi.noi ? ' tại ' + cuoi.noi : '') + (viTri ? '' : ' (không có vị trí)') + '.', 'ok');
          hienHomNay(kq.homNay);
        })
        .catch(function (e) { baoLoi(msg, e.message, 'err'); })
        .then(function () { $('btnVao').disabled = $('btnRa').disabled = false; });
    });
  }

  $('btnDangNhap').onclick = function () {
    var maNV = $('maNV').value.trim().toLowerCase(), pin = $('pin').value.trim();
    if (!maNV || !pin) { baoLoi($('msgDangNhap'), 'Hãy nhập mã nhân viên và mã PIN.', 'err'); return; }
    dangNhap(maNV, pin, false);
  };
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnDangNhap').click(); });
  $('btnVao').onclick = function () { cham('VÀO'); };
  $('btnRa').onclick = function () { cham('RA'); };
  $('btnLichSu').onclick = xemLichSu;
  $('btnThoat').onclick = function () {
    luu('cc_maNV', null); luu('cc_pin', null);
    phien = null;
    $('pin').value = ''; $('btnDangNhap').disabled = false; $('msgDangNhap').className = 'msg';
    $('manChamCong').classList.add('hidden');
    $('manDangNhap').classList.remove('hidden');
  };

  (function khoiDong() {
    var m = doc('cc_maNV'), p = doc('cc_pin');
    if (m) $('maNV').value = m;
    if (m && p) dangNhap(m, p, true);
  })();
</script>
</body>
</html>
